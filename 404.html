<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Mostafa Shaban</title>
  <link rel="icon" href="assets/images/photo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/glass.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .err-card { padding: 48px 36px; max-width: 420px; }
    .err-code {
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 4rem; font-weight: 800;
      background: var(--accent-gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
    }
    .err-msg { color: var(--text-secondary); margin-bottom: 28px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursor-glow"></div>
  <div class="err-card glass-card">
    <div class="err-code">404</div>
    <p class="err-msg">This page doesn't exist — maybe it moved, or the link is off.</p>
    <a href="index.html" class="btn btn-primary">← Back to Portfolio</a>
  </div>

  <script>
    const theme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    (function initCursorGlow() {
      const glow = document.getElementById('cursor-glow');
      if (!glow) return;
      if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let curX = mouseX, curY = mouseY;
      window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
      function animate() {
        curX += (mouseX - curX) * 0.12;
        curY += (mouseY - curY) * 0.12;
        glow.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%)`;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
