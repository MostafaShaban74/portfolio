<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mostafa Shaban — Links</title>
  <link rel="icon" href="assets/images/photo.jpg" type="image/jpeg" />
  <meta name="description" content="All links — Mostafa Shaban, Data Analyst." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/glass.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
    .links-page { max-width: 460px; width: 100%; text-align: center; }
    .links-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .svc-back {
      display: block;
      width: 100%;
      text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; font-weight: 600;
      color: var(--text-secondary); text-decoration: none; margin-bottom: 16px;
      transition: color 0.2s;
    }
    .svc-back:hover { color: var(--accent); }
    .links-photo {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      margin: 0 auto 16px; display: block; border: 3px solid var(--accent);
    }
    .links-photo-placeholder {
      width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 16px;
      background: var(--accent-gradient); display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 2rem; color: white;
    }
    .links-name {
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.3rem; font-weight: 700;
      color: var(--text-primary); margin-bottom: 4px;
    }
    .links-tagline { color: var(--accent); font-size: 0.9rem; margin-bottom: 32px; }
    .link-item {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px;
      margin-bottom: 12px; text-decoration: none; color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 0.95rem;
      transition: all 0.25s ease;
    }
    .link-item:hover { transform: translateY(-3px); border-color: var(--border-accent); }
    .link-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-icon svg { width: 100%; height: 100%; }
    .links-footer { margin-top: 32px; font-size: 0.8rem; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
    .links-footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<div class="links-page">
  <a href="index.html" class="svc-back" id="links-back-btn">← Back to Portfolio</a>
  <div class="links-controls">
    <button class="nav-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
    <button class="nav-btn lang-btn" id="lang-toggle" onclick="toggleLang()" aria-label="Toggle language">AR</button>
  </div>

  <img src="assets/images/photo.jpg" alt="Mostafa Shaban" class="links-photo reveal"
    onerror="this.style.display='none';document.getElementById('links-photo-ph').style.display='flex'">
  <div class="links-photo-placeholder reveal" id="links-photo-ph" style="display:none">MS</div>

  <div class="links-name reveal" id="links-name">Mostafa Shaban</div>
  <div class="links-tagline reveal" id="links-tagline">Data Analyst | Freelance Analytics Coach</div>

  <div id="links-list"></div>

  <div class="links-footer">© 2026 Mostafa Shaban. All rights reserved.</div>
</div>

  function applyTheme(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    document.documentElement.setAttribute('lang', currentLang);
    document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('lang-toggle').textContent = currentLang === 'en' ? 'AR' : 'EN';
    render();
  }

  function render() {
    const d = LINKS_DATA[currentLang];
    document.getElementById('links-tagline').textContent = d.tagline;
    document.getElementById('links-back-btn').textContent = d.back;
    document.getElementById('links-list').innerHTML = d.items.map((i, idx) => `
      <a href="${i.url}" target="${i.url.startsWith('http') ? '_blank' : '_self'}" class="link-item glass-card reveal" style="transition-delay:${idx * 0.06}s">
        <span class="link-icon">${i.icon}</span>
        <span>${i.label}</span>
      </a>
    `).join('');
    setTimeout(() => {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('revealed'));
    }, 100);
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(currentTheme);
    render();
  });
</script>

</body>
</html>
